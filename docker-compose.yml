version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database (Raw / Bronze Layer Storage)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pension_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pension_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Synthetic Data Generator API
  # ---------------------------------------------------------------------------
  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: pension_generator
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: